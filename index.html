<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOUSLA — Production System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ====================== BOUSLA PRO · نظام خفيف سريع ====================== */
*{box-sizing:border-box}
:root{
  --navy:#0f172a; --navy2:#1e3a8a; --gold:#f59e0b; --gold2:#d97706;
  --teal:#0d9488; --purple:#7c3aed; --ink:#101827; --muted:#64748b;
  --line:#e3e9f3; --bg:#f5f7fb; --rad:16px;
  --s1:0 2px 6px rgba(15,23,42,.05),0 12px 28px rgba(15,23,42,.06);
  --font:"Cairo","Segoe UI",Tahoma,sans-serif; --brand:"Poppins","Cairo",sans-serif;
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
b,strong{font-weight:900}

/* ---------- الهيكل ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{background:linear-gradient(175deg,#0f172a,#16224a 60%,#1e3a8a);color:#e8eefc;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--brand);font-weight:900;font-size:20px;
  background:linear-gradient(135deg,var(--gold),#f97316);color:#20160a;box-shadow:0 8px 20px rgba(245,158,11,.35)}
.brand b{display:block;font-family:var(--brand);font-size:19px;letter-spacing:1.4px;color:#fff}
.brand i{font-style:normal;font-size:11px;font-weight:700;color:#a9b7d6;letter-spacing:.6px}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:transparent;border:0;color:#dbe4f7;
  font-size:14px;font-weight:800;padding:11px 12px;border-radius:12px;cursor:pointer;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:linear-gradient(90deg,rgba(245,158,11,.28),rgba(245,158,11,.05));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.side-foot{margin-top:auto;font-size:11.5px;line-height:1.8;color:#9fb0d4;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:19px;font-weight:900}
.top p{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:700}
.top .acts{margin-inline-start:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.saved{font-size:11.5px;font-weight:800;color:var(--muted);background:#f1f5fb;border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:13px;font-weight:800;padding:9px 14px;border-radius:11px;cursor:pointer;transition:.15s}
.btn:hover{box-shadow:var(--s1);border-color:#cdd8ea}
.btn.gold{background:linear-gradient(135deg,var(--gold),#f97316);border:0;color:#241a02}
.btn.navy{background:var(--navy);border:0;color:#fff}
.btn svg{width:16px;height:16px}
.wrap{padding:22px 24px 60px;max-width:1180px;width:100%}

/* ---------- الصفحات ---------- */
.page{display:none}
.page.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--s1);margin-bottom:18px;overflow:hidden}
.card>h3{margin:0;padding:14px 18px;font-size:15.5px;font-weight:900;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fbfcfe,#f4f7fc);display:flex;align-items:center;gap:9px}
.card>h3 .tag{margin-inline-start:auto;font-size:11px;font-weight:800;color:#7c4a03;background:#fff7ed;border:1px solid #fed7aa;border-radius:999px;padding:3px 10px}
.card .in{padding:16px 18px}
.lead{background:#fff;border:1px dashed #d7e0ee;border-radius:14px;padding:13px 16px;font-size:13.5px;font-weight:700;line-height:1.9;color:#334155;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--s1);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--c,var(--gold))}
.kpi .l{font-size:12px;font-weight:800;color:var(--muted)}
.kpi .v{font-family:var(--brand);font-size:26px;font-weight:900;color:var(--navy);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tile{display:block;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--s1);transition:.15s}
.tile:hover{transform:translateY(-2px);border-color:#cdd8ea}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c,var(--navy));margin-bottom:10px}
.tile b{display:block;font-size:15px;margin-bottom:4px}
.tile span{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.8}

/* ---------- جدول ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:start;border-bottom:1px solid #edf1f8;vertical-align:top}
thead th{background:#f3f6fc;font-weight:900;color:#1e3a8a;font-size:12.5px;position:sticky;top:0;z-index:2;white-space:nowrap}
tbody tr:nth-child(even) td{background:#fafcff}
tbody tr:hover td{background:#fffdf5}
td[contenteditable]{min-width:70px;border-radius:6px}
td[contenteditable]:focus,[data-k]:focus{outline:2px solid var(--gold);outline-offset:1px;background:#fffdf6}
.core td{background:#fffbeb!important}
.core td:first-child{box-shadow:inset 4px 0 0 var(--gold)}
.pill{display:inline-block;font-size:11px;font-weight:900;border-radius:999px;padding:3px 10px;background:#eef2f8;color:#334155}
.pill.p1{background:#e0f2fe;color:#075985}
.pill.p2{background:#ede9fe;color:#5b21b6}
.pill.core{background:linear-gradient(135deg,var(--gold),#f97316);color:#241a02}
.ck{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}
.ck label{display:flex;align-items:flex-start;gap:9px;background:#f9fbff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:13px;font-weight:700}
.ck input{margin-top:3px;width:16px;height:16px;accent-color:var(--gold)}

/* ---------- حقول ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.f label{display:block;font-size:12px;font-weight:900;color:#1e3a8a;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink);
  padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}
.f input:focus,.f select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,158,11,.15)}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;line-height:1.9;color:#334155}

/* ---------- السكريبتات ---------- */
.sc{background:#fff;border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--s1);margin-bottom:18px;overflow:hidden;border-inline-start:6px solid var(--c,var(--gold))}
.sc .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px;background:linear-gradient(180deg,#fbfcfe,#f3f6fc);border-bottom:1px solid var(--line)}
.sc .h .n{font-family:var(--brand);font-weight:900;font-size:12px;color:#fff;background:var(--navy);border-radius:999px;padding:4px 11px}
.sc .h input[type=text]{flex:1 1 200px;min-width:150px;font:inherit;font-size:14px;font-weight:900;padding:8px 11px;border:1px solid var(--line);border-radius:10px}
.sc .h input[type=date],.sc .h select{font:inherit;font-size:12.5px;font-weight:800;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.sc .tools{display:flex;gap:6px;margin-inline-start:auto}
.sc .body{padding:14px}
.sc .lbl{font-size:12.5px;font-weight:900;color:#1e3a8a;margin-bottom:5px}
.area{min-height:120px;border:1.5px dashed #d5deee;border-radius:12px;padding:12px;font-size:14px;line-height:2;
  white-space:pre-wrap;background:#fcfdff}
.area:focus{outline:none;border-style:solid;border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(245,158,11,.12)}
.area:empty:before{content:attr(data-ph);color:#9aa6bb;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:0 14px 14px}
.gal:empty{display:none}
.gal figure{position:relative;margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.gal img{display:block;width:100%;height:130px;object-fit:cover}
.gal .x{position:absolute;top:6px;inset-inline-start:6px;width:24px;height:24px;border:0;border-radius:7px;background:rgba(15,23,42,.72);color:#fff;cursor:pointer}
.sc.drag{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,158,11,.2)}
.tb{font:inherit;font-size:12px;font-weight:900;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.tb:hover{border-color:#cdd8ea;box-shadow:var(--s1)}
.tb.red{color:#b91c1c;border-color:#fecaca}
.hint{font-size:12px;font-weight:700;color:var(--muted)}
.meter{font-size:11.5px;font-weight:900;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:999px;padding:5px 11px}
.meter.warn{background:#fef2f2;color:#b91c1c;border-color:#fecaca}

/* ---------- تنبيه صغير لا يغطي الكلام ---------- */
.toast{position:fixed;top:9px;inset-inline-start:9px;transform:translateY(-220%);background:rgba(15,23,42,.93);color:#fff;
  font-size:11.5px;font-weight:800;padding:7px 12px;border-radius:9px;z-index:99;transition:.25s;pointer-events:none;max-width:270px}
.toast.on{transform:none}

/* ---------- الغلاف (يظهر في الطباعة فقط) ---------- */
.cover{display:none}
.no-screen{display:none}
@media print{
  @page{size:A4;margin:11mm}
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .side,.top,.no-print,.toast,.tools,.btn,.gate,.who,.mem-only{display:none!important}
  .app{display:block}
  .wrap{padding:0;max-width:none}
  .page{display:none}
  body.pr .page.on{display:block!important}
  body.pr.one .sc{display:none!important}
  body.pr.one .sc.target{display:block!important}
  /* غلاف بأشكال وألوان */
  .cover{display:flex!important;position:relative;overflow:hidden;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;height:254mm;padding:22mm 16mm;border:6px solid var(--c,var(--navy));border-radius:12px;background:#fff}
  .cover .sh{position:absolute;border-radius:50%;background:var(--cs,rgba(245,158,11,.16))}
  .cover .sh.a{width:190mm;height:190mm;top:-75mm;inset-inline-start:-70mm}
  .cover .sh.b{width:130mm;height:130mm;bottom:-55mm;inset-inline-end:-45mm}
  .cover .sh.c{width:60mm;height:60mm;bottom:26mm;inset-inline-start:20mm;background:var(--cs,rgba(245,158,11,.12))}
  .cover .wm{position:relative;font-family:var(--brand);font-weight:900;font-size:56px;letter-spacing:5px;color:var(--navy);line-height:1}
  .cover .wm i{font-style:normal;color:var(--c,var(--gold))}
  .cover .sub{position:relative;font-size:13px;font-weight:800;letter-spacing:3px;color:#64748b;margin-top:8px}
  .cover .line{position:relative;width:70mm;height:4px;border-radius:99px;background:var(--c,var(--gold));margin:18px 0}
  .cover .badge{position:relative;border:2.5px solid var(--c,var(--gold));color:#3f2c05;background:#fff;border-radius:999px;
    font-size:15px;font-weight:900;padding:7px 26px;letter-spacing:1px}
  .cover .ttl{position:relative;font-size:27px;font-weight:900;color:var(--navy);line-height:1.7;margin-top:20px;padding:14px 6px;
    border-top:2px solid #dbe3f0;border-bottom:2px solid #dbe3f0;width:100%}
  .cover .by{position:relative;margin-top:18px;font-size:15px;font-weight:800;color:#1e3a8a;line-height:2}
  .cover .f{position:absolute;bottom:12mm;font-size:11px;font-weight:800;color:#64748b}
  /* رأس الورقة الملون */
  .sheet{display:flex!important;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:12px;border-bottom:4px solid var(--c,var(--gold))}
  .sheet .wm2{font-family:var(--brand);font-weight:900;font-size:19px;letter-spacing:2px;color:var(--navy)}
  .sheet .k{background:var(--c,var(--gold));color:#fff;border-radius:999px;font-size:11px;font-weight:900;padding:4px 13px}
  .sheet .m{margin-inline-start:auto;font-size:10.5px;font-weight:800;color:#64748b}
  /* تنسيق الطباعة: كلام ملزوق بدون فراغ */
  .card,.sc{box-shadow:none!important;border:1px solid #dfe6f2!important;border-radius:10px;margin:0 0 12px!important;break-inside:avoid}
  .card>h3{background:#f6f8fc!important;border-bottom:1px solid #e2e9f4!important;font-size:13.5px;padding:9px 12px}
  .card .in{padding:11px 12px}
  .lead{background:#fff!important;border:1px solid #e2e9f4!important;font-size:12px;padding:9px 11px;margin-bottom:11px}
  table{font-size:10.5px}
  th,td{padding:5px 7px;border-bottom:1px solid #e9eef7}
  thead th{background:#eef3fb!important;color:#1e3a8a!important}
  .tw{overflow:visible!important;border:1px solid #dfe6f2!important}
  .ck{grid-template-columns:1fr 1fr;gap:5px}
  .ck label{background:#fff!important;border:1px solid #e6ecf6!important;font-size:10.5px!important;padding:5px 7px}
  .note{font-size:11.5px;padding:8px 10px}
  .area,.fields,.f input,.f select,.f label{border-color:#e2e9f4!important}
  .f input,.f select{font-size:12px}
  .gal{display:flex!important;flex-wrap:wrap;gap:7px;padding:4px 0 0}
  .gal figure{flex:1 1 calc(50% - 7px);max-width:calc(50% - 7px);border:1px solid #dfe6f2!important;break-inside:avoid}
  .gal img{height:auto!important;max-height:70mm;object-fit:contain}
  .gal .x{display:none!important}
  .area{border:0!important;padding:0!important;background:#fff!important;font-size:13px;line-height:1.95}
  .sc{border-inline-start-width:6px!important;display:block!important}
  .sc .h{display:none!important}
  .sc .body{padding:0!important}
  .sc .lbl{color:#1e3a8a!important;font-size:12px;margin-bottom:3px}
  /* الأعضاء والـCV في الطباعة */
  .mem{break-inside:avoid;box-shadow:none!important;border:1px solid #e2e9f4!important;border-radius:10px;padding:8px 10px;margin-bottom:8px}
  .mem .ava{width:34px;height:34px;font-size:11px;border-radius:9px}
  .mem .mi input{border:0!important;padding:0!important;font-size:12px;background:#fff!important}
  .macts,.pv,.mem .cvbox .tb{display:none!important}
  .cvv{border:0!important;background:#f8fafc!important;font-size:11px;padding:4px 8px}
  /* مواعيد العمل في الطباعة */
  .wrow select.k{background:#f8fafc!important;color:#0f172a!important;border:1px solid #dbe3f0!important;font-size:10px;padding:2px 6px;width:auto}
  .wsum span{background:#fff!important;border:1px solid #dbe3f0!important;color:#155e75!important;font-size:10.5px;padding:4px 9px}
  .wrow td.time{font-size:10.5px}
}

/* ---------- الأعضاء والـCV ---------- */
.mem{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;box-shadow:var(--s1);margin-bottom:11px;border-inline-start:5px solid var(--c,var(--navy))}
.mem .ava{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--brand);font-weight:900;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--c,#e11d48),#0f172a)}
.mem .mi{display:grid;gap:6px;flex:1 1 230px;min-width:190px}
.mem .mi input{font:inherit;font-size:13.5px;font-weight:800;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.mem .cvbox{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1 1 330px}
.cvv{font-size:12.5px;font-weight:800;color:#334155;background:#f4f7fc;border:1px dashed #cdd8ea;border-radius:10px;padding:7px 11px}
.cvv.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.macts{display:flex;gap:6px}
.pv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin:-4px 0 14px}
.pv iframe{display:block;width:100%;height:540px;border:0;background:#fff}

/* ---------- مواعيد العمل ---------- */
.wrow td{padding:7px 9px}
.wrow select.k{font:inherit;font-size:12px;font-weight:900;border:0;border-radius:999px;padding:5px 11px;background:#eef2f8;color:#334155;cursor:pointer;width:100%}
.wrow select.k[data-v="تصوير"]{background:#ccfbf1;color:#115e59}
.wrow select.k[data-v="مونتاج"]{background:#ede9fe;color:#5b21b6}
.wrow select.k[data-v="كتابة"]{background:#fef3c7;color:#92400e}
.wrow select.k[data-v="اجتماع"]{background:#dbeafe;color:#1e40af}
.wrow select.k[data-v="بث / تسجيل"]{background:#ffe4e6;color:#9f1239}
.wrow select.k[data-v="أجازة"]{background:#e2e8f0;color:#475569}
.wrow td.time{font-family:var(--brand);font-weight:800;direction:ltr;text-align:center;white-space:nowrap}
.wsum{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.wsum span{font-size:12.5px;font-weight:900;background:#ecfeff;color:#155e75;border:1px solid #a5f3fc;border-radius:999px;padding:6px 12px}
.presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}

/* ---------- تسجيل الدخول والصلاحيات ---------- */
.gate{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:18px;
  background:linear-gradient(160deg,#0f172a,#16224a 55%,#1e3a8a)}
.gate.hide{display:none}
.gate-card{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:26px 24px;
  box-shadow:0 30px 70px rgba(2,6,23,.45);text-align:center}
.gate-brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:16px}
.gate-brand .logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--brand);
  font-weight:900;font-size:22px;color:#20160a;background:linear-gradient(135deg,var(--gold),#f97316);box-shadow:0 8px 20px rgba(245,158,11,.35)}
.gate-brand b{display:block;font-family:var(--brand);font-size:22px;letter-spacing:2px;color:var(--navy);line-height:1.1}
.gate-brand i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:1.4px}
.gate-card h2{margin:0 0 6px;font-size:19px;font-weight:900}
.gate-sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.8}
.gate-err{min-height:19px;color:#b91c1c;font-size:12.5px;font-weight:800;margin-top:9px}
.gate-foot{margin-top:14px;font-size:11px;font-weight:700;color:#94a3b8}
.who{display:flex;align-items:center;gap:8px;background:#f1f5fb;border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.who b{font-size:13px;font-weight:900}
.who .r{font-style:normal;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 9px;background:#e2e8f0;color:#475569}
.who .r.admin{background:linear-gradient(135deg,var(--gold),#f97316);color:#241a02}
.who .r.mem{background:#dbeafe;color:#1e40af}
.me-card{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
